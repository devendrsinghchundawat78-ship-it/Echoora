name: Echoora Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK (FOSS - No Google Services needed)
        run: ./gradlew assembleUniversalFossDebug

      - name: Rename APK
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
          echo "App Version: $VERSION_NAME"
          mkdir -p app/build/outputs/apk/release-artifacts
          find app/build/outputs/apk/ -name "*.apk" ! -path "*/release-artifacts/*" | while read -r apk_path; do
              target_name="Echoora-${VERSION_NAME}-Universal-Debug.apk"
              cp "$apk_path" "app/build/outputs/apk/release-artifacts/$target_name"
              echo "Copied $apk_path -> $target_name"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Echoora-APK
          path: app/build/outputs/apk/release-artifacts/*.apk
